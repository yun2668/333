<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" rx="34" fill="#f1faf9"/>
<g font-family="Microsoft JhengHei,Arial">
<text x="60" y="75" font-size="38" font-weight="700" fill="#143d49">汽油車排氣定檢 4 步驟</text>
<text x="60" y="115" font-size="19" fill="#607982">到監理所站或認可代檢廠，系統會自動判斷是否需要驗排氣。</text>
<g transform="translate(60 175)">
  <g><rect width="230" height="330" rx="24" fill="#fff" stroke="#d2e3e4"/><circle cx="115" cy="82" r="46" fill="#e5f7f3"/><text x="115" y="98" text-anchor="middle" font-size="42">📅</text><text x="115" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#173f4a">1. 確認期限</text><text x="115" y="205" text-anchor="middle" font-size="16" fill="#617a82">原發照月份</text><text x="115" y="234" text-anchor="middle" font-size="16" fill="#617a82">前後各 1 個月</text></g>
  <text x="255" y="170" font-size="38" fill="#48b7a8">→</text>
  <g transform="translate(285 0)"><rect width="230" height="330" rx="24" fill="#fff" stroke="#d2e3e4"/><circle cx="115" cy="82" r="46" fill="#eaf5fb"/><text x="115" y="98" text-anchor="middle" font-size="42">📍</text><text x="115" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#173f4a">2. 前往檢驗</text><text x="115" y="205" text-anchor="middle" font-size="16" fill="#617a82">監理所站或</text><text x="115" y="234" text-anchor="middle" font-size="16" fill="#617a82">認可汽車代檢廠</text></g>
  <text x="540" y="170" font-size="38" fill="#48b7a8">→</text>
  <g transform="translate(570 0)"><rect width="230" height="330" rx="24" fill="#fff" stroke="#d2e3e4"/><circle cx="115" cy="82" r="46" fill="#fff4df"/><text x="115" y="98" text-anchor="middle" font-size="42">🔬</text><text x="115" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#173f4a">3. 排氣檢測</text><text x="115" y="205" text-anchor="middle" font-size="16" fill="#617a82">量測 CO、HC</text><text x="115" y="234" text-anchor="middle" font-size="16" fill="#617a82">及相關檢驗數值</text></g>
  <text x="825" y="170" font-size="38" fill="#48b7a8">→</text>
  <g transform="translate(855 0)"><rect width="230" height="330" rx="24" fill="#fff" stroke="#d2e3e4"/><circle cx="115" cy="82" r="46" fill="#e4f7ee"/><text x="115" y="98" text-anchor="middle" font-size="42">✅</text><text x="115" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#173f4a">4. 完成檢驗</text><text x="115" y="205" text-anchor="middle" font-size="16" fill="#617a82">合格完成</text><text x="115" y="234" text-anchor="middle" font-size="16" fill="#617a82">不合格需修復複驗</text></g>
</g>
</g>
</svg>